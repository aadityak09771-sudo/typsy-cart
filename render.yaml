services:
  - type: web
    name: tipsycart-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tipsycart-database
          property: connectionString

databases:
  - name: tipsycart-database
    databaseName: tipsycart
    user: tipsycart
    plan: free
